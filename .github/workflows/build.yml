name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SteamRT3
            runtime: steamrt3
          - name: SteamRT4
            runtime: steamrt4
    container:
      image: ghcr.io/femboykz/build-containers:${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Init mm-utils
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          git submodule update --init --depth 1 mm-utils

      - uses: ./mm-utils/build/ci/init

      - uses: ./mm-utils/build/ci/linux
        with:
          artifact: cs2rtv
          runtime: ${{ matrix.runtime }}

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Init mm-utils
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          git submodule update --init --depth 1 mm-utils

      - uses: ./mm-utils/build/ci/init

      - uses: ./mm-utils/build/ci/windows
        with:
          artifact: cs2rtv

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init mm-utils
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          git submodule update --init --depth 1 mm-utils

      - uses: ./mm-utils/build/ci/release
        with:
          artifact: cs2rtv
